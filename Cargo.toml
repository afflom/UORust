[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.1"
edition = "2021"
# Raise this when something here needs a newer compiler; nothing does yet.
rust-version = "1.89"
license = "MIT OR Apache-2.0"
# Instantiated repositories set their own URLs here.
repository = "https://github.com/afflom/UORust"
homepage = "https://afflom.github.io/UORust/"
authors = ["UOR Foundation"]
keywords = []
categories = []

[workspace.dependencies]
repo-model = { version = "0.1.1", path = "crates/model" }
# A `path` dependency with no `version` is a wildcard requirement, and
# `cargo deny` refuses those (`wildcards = "deny"`). Every internal dependency
# carries both.
repo-conformance = { version = "0.1.1", path = "crates/conformance" }
uorust = { version = "0.1.1", path = "crates/uorust" }
uorust-certified = { version = "0.1.1", path = "crates/certified" }

[workspace.lints.rust]
missing_docs = "deny"
# `uorust mir` dumps the translator under `--cfg uorust_lift`, so the self
# register lifts each hand-written body without its certified dispatch.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(uorust_lift)"] }
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Publishes the patched PrismPM SDK this project pins until a PrismPM release
# carries the fix (UOR-Foundation/PrismPM#612, PR #613). The image is the
# pinned SDK candidate's own layers plus the patched `prismpm` binary and the
# inventory that names it, assembled by sdk-patch/assemble.py; nothing else in
# the SDK changes. Run it from the Actions tab; the summary prints the
# immutable index reference to pin in prismpm.lock.
name: sdk-patch

on:
  workflow_dispatch:
    inputs:
      prismpm-revision:
        description: PrismPM commit to build prismpm from (the pinned SDK commit plus the fix).
        required: true
        default: 29b4c8b7d6467e3b9a98cce5c5fa88ddcc56bc1c
      base-image:
        description: SDK candidate index the patched image extends.
        required: true
        default: ghcr.io/uor-foundation/prismpm-sdk-candidate@sha256:f9bb61a843ef4e42b6d22ee1cff5ca9d5c8d9ba2782d8da7e55008ae3f61bd16

permissions: {}

jobs:
  binary:
    name: prismpm / ${{ matrix.arch }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: amd64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build prismpm at the exact revision
        env:
          REVISION: ${{ inputs.prismpm-revision }}
        shell: bash
        run: |
          set -euo pipefail
          [[ $REVISION =~ ^[0-9a-f]{40}$ ]]
          git init -q prismpm
          git -C prismpm fetch -q --depth 1 https://github.com/UOR-Foundation/PrismPM.git "$REVISION"
          git -C prismpm checkout -q FETCH_HEAD
          cd prismpm
          cargo build --locked --release --package prismpm
      - name: Assemble the patched layers
        env:
          BASE: ${{ inputs.base-image }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: python3 sdk-patch/assemble.py layer "$ARCH" prismpm/target/release/prismpm "$BASE" "out-$ARCH"
      - name: Keep the layers for the publish job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sdk-patch-${{ matrix.arch }}
          path: out-${{ matrix.arch }}
          retention-days: 7

  publish:
    name: publish the patched SDK index
    needs: binary
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch both architectures
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: sdk-patch-*
      - name: Push layers, manifests and the index
        env:
          BASE: ${{ inputs.base-image }}
          REVISION: ${{ inputs.prismpm-revision }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        run: |
          set -euo pipefail
          owner=$(tr '[:upper:]' '[:lower:]' <<< "$OWNER")
          ref=$(python3 sdk-patch/assemble.py index "ghcr.io/$owner/prismpm-sdk-patched:sha-$REVISION" "$BASE" sdk-patch-amd64 sdk-patch-arm64)
          printf 'Patched SDK: `%s`\n' "$ref" | tee -a "$GITHUB_STEP_SUMMARY"

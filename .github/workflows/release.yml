# Publishes the `uorust` CLI as an installable product. A tag `v*` builds the
# binary natively on each platform from the locked workspace, with the
# toolchain rust-toolchain.toml pins, and attaches every archive to the tag's
# GitHub release with its SHA-256 sum and a signed build-provenance
# attestation. The signer is this repository's release workflow through
# GitHub's OIDC issuer; check a download with
#   gh attestation verify uorust-<target>.tar.gz --repo afflom/UORust
# release-tag.yml cuts the tag for a green main whose workspace version has none
# and dispatches this workflow for it (a tag the workflow token pushes starts
# no `push` run); a tag pushed by hand runs it directly.
# Windows is built where it builds: its leg may fail without holding back the
# release, which then carries the other four platforms.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The existing v* tag to build and publish.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: build uorust for ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            optional: false
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            optional: false
          - target: x86_64-apple-darwin
            runner: macos-15
            optional: false
          - target: aarch64-apple-darwin
            runner: macos-15
            optional: false
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            optional: true
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Install the pinned toolchain for the target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - name: Build the locked release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          cargo build --release --locked -p uorust --bin uorust --target "$TARGET"
      - name: Package the binary with its sum
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/uorust-release"
          stage="$RUNNER_TEMP/uorust-$TARGET"
          mkdir -p "$out" "$stage"
          cp LICENSE-APACHE LICENSE-MIT README.md "$stage/"
          if [[ $TARGET == *windows* ]]; then
            cp "target/$TARGET/release/uorust.exe" "$stage/"
            archive="uorust-$TARGET.zip"
            (cd "$RUNNER_TEMP" && 7z a -tzip "$out/$archive" "uorust-$TARGET" >/dev/null)
          else
            cp "target/$TARGET/release/uorust" "$stage/"
            archive="uorust-$TARGET.tar.gz"
            tar -C "$RUNNER_TEMP" -czf "$out/$archive" "uorust-$TARGET"
          fi
          cd "$out"
          # One text form on every platform, "<hex>  <name>": Git Bash's
          # sha256sum on Windows marks binary mode with "*<name>".
          if command -v sha256sum >/dev/null; then
            digest=$(sha256sum "$archive" | cut -d' ' -f1)
          else
            digest=$(shasum -a 256 "$archive" | cut -d' ' -f1)
          fi
          printf '%s  %s\n' "$digest" "$archive" >"$archive.sha256"
          {
            echo "path=$out"
            echo "archive=$out/$archive"
          } >>"$GITHUB_OUTPUT"
      - name: Sign the archive's provenance as this repository's release workflow
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.archive }}
          show-summary: false
      - name: Upload the archive and its sum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: uorust-${{ matrix.target }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

  publish:
    name: attach the archives to the release
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Download every archive that built
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: uorust-*
          path: dist
          merge-multiple: true
      - name: Require the four required platforms
        shell: bash
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            test -f "dist/uorust-$target.tar.gz" || { echo "missing uorust-$target.tar.gz" >&2; exit 1; }
            test -f "dist/uorust-$target.tar.gz.sha256" || { echo "missing its sum" >&2; exit 1; }
          done
          (cd dist && cat ./*.sha256 >SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Create the release with the archives, their sums and SHA256SUMS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes="Install: curl -fsSL https://github.com/$REPOSITORY/raw/$TAG/install.sh | UORUST_VERSION=$TAG sh
          (Windows: install.ps1), cargo binstall uorust, brew install afflom/uorust/uorust, nix run github:$REPOSITORY/$TAG,
          or from source: cargo install --locked --git https://github.com/$REPOSITORY --tag $TAG uorust

          Or download the archive for your platform, check it with SHA256SUMS, and verify its provenance:
          gh attestation verify uorust-<target>.tar.gz --repo $REPOSITORY"
          if gh release view "$TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPOSITORY" --title "UORust $TAG" --notes "$notes" --generate-notes --verify-tag
          fi

  # crates.io: every publishable crate of the tagged workspace, each after the
  # crates it depends on (scripts/release/crates.py). A version already on
  # crates.io is left as it is, so a re-dispatched tag publishes only what is
  # missing. Without the CARGO_REGISTRY_TOKEN secret the job says so and skips.
  crates:
    name: publish the crates to crates.io
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Publish in dependency order
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z ${CARGO_REGISTRY_TOKEN:-} ]]; then
            echo "::notice title=crates.io skipped::The CARGO_REGISTRY_TOKEN secret is not set (Settings > Secrets and variables > Actions); no crate was published."
            exit 0
          fi
          rustup show active-toolchain || rustup toolchain install
          cargo metadata --locked --no-deps --format-version 1 >"$RUNNER_TEMP/metadata.json"
          python3 -I scripts/release/crates.py <"$RUNNER_TEMP/metadata.json" >"$RUNNER_TEMP/order"
          while read -r crate; do
            version=$(python3 -I -c 'import json, sys; print(next(p["version"] for p in json.load(open(sys.argv[1]))["packages"] if p["name"] == sys.argv[2]))' "$RUNNER_TEMP/metadata.json" "$crate")
            if curl -fsS -o /dev/null -A "afflom/UORust release workflow" "https://crates.io/api/v1/crates/$crate/$version"; then
              echo "$crate $version is already on crates.io"
              continue
            fi
            cargo publish --locked -p "$crate"
            echo "- published $crate $version" >>"$GITHUB_STEP_SUMMARY"
          done <"$RUNNER_TEMP/order"

  # Homebrew: Formula/uorust.rb on main, written from this release's
  # SHA256SUMS by scripts/release/formula.py, so that
  #   brew tap afflom/uorust https://github.com/afflom/UORust
  #   brew install afflom/uorust/uorust
  # installs the newest release. An older tag re-dispatched leaves it.
  formula:
    name: point the Homebrew formula at the release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Write the formula from the release's SHA256SUMS and push it to main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          sums="$RUNNER_TEMP/SHA256SUMS"
          gh release download "$TAG" --repo "$REPOSITORY" --pattern SHA256SUMS --output "$sums"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          remote="https://github.com/$REPOSITORY.git"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Rebase onto a moving main until the push lands; the job's timeout bounds it.
          while :; do
            git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q "$remote" main
            git reset -q --hard FETCH_HEAD
            current=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/uorust.rb 2>/dev/null || true)
            if [[ -n $current ]] && [[ $(printf '%s\n%s\n' "$current" "${TAG#v}" | sort -V | tail -n1) != "${TAG#v}" ]]; then
              echo "formula: main's formula is at $current, newer than $TAG; left as it is"
              exit 0
            fi
            mkdir -p Formula
            python3 -I scripts/release/formula.py . "$TAG" "$sums" >Formula/uorust.rb
            git add Formula/uorust.rb
            if git diff --cached --quiet; then
              echo "formula: Formula/uorust.rb already installs $TAG"
              exit 0
            fi
            git commit -q -m "Point the Homebrew formula at $TAG" -m "Written by the release workflow from the SHA256SUMS of $TAG."
            if git -c "http.extraheader=AUTHORIZATION: basic $auth" push -q "$remote" HEAD:refs/heads/main; then
              break
            fi
          done
          # A push with the workflow token starts no workflow: gate the new head
          # and check the channels it changes.
          for workflow in bootstrap.yml install.yml; do
            gh workflow run "$workflow" --repo "$REPOSITORY" --ref main
          done
          printf '## Homebrew\n\nFormula/uorust.rb installs %s.\n' "$TAG" >>"$GITHUB_STEP_SUMMARY"

# Keeps every generated file current on main. On each push to main it runs
# `just generate` (every writer the gate checks the output of) through the
# locked SDK and, when anything changed, pushes the result as one commit and
# dispatches the gate and the page for it. Nobody has to remember a writer:
# a push that forgot one is followed by the commit that runs it. Each hour it
# also re-pins the brand to uor.foundation's newest main (brand/foundation.lock),
# so the brand, design and context-of-use facets regenerate from it; a site
# change that breaks a WCAG contrast fails the writer and is not pinned. Every
# run re-decides the MIR path's translations (`uorust prove`) and publishes the
# lift's honesty report: how many functions lifted, and the residue by the MIR
# kind or obligation that stopped it.
name: generate

on:
  push:
    branches: [main]
  # Hourly, so the brand follows uor.foundation without a push here.
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# Only the newest main matters: an older run's output would be refused anyway.
concurrency:
  group: generate
  cancel-in-progress: true

jobs:
  generate:
    name: run every writer and push what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Follow uor.foundation, the brand authority
        shell: bash
        run: |
          python3 -I scripts/experience/authority.py . --follow
          # Keep the new pin only when its brand still meets WCAG 2.2.
          if ! python3 -I scripts/experience/experience.py "$(mktemp -d)" .; then
            git checkout -- brand
            echo "::warning::uor.foundation's newest main breaks a WCAG 2.2 contrast; the brand stays pinned"
          fi
      - name: Run every writer through the locked SDK
        shell: bash
        run: scripts/ci/sdk.sh 'just generate'
      - name: Publish the lift's honesty report
        if: always()
        shell: bash
        run: |
          {
            echo '## Lift honesty report'
            echo
            echo '```'
            sed -n '/^# Honesty report/,/^$/p' frontier.toml | sed 's/^# \{0,1\}//'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Push the regenerated files and dispatch the gate and the page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/ci/push.sh "Regenerate the generated files" \
            "CONFORMANCE.md README.md app model brand frontier.toml lift-verdicts.toml crates/uorust/tests/fixtures/thermostat-prism crates/uorust/tests/fixtures/mir-path/lift-verdicts.toml" \
            bootstrap.yml pages.yml

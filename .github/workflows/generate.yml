# Keeps every generated file current on main. On each push to main it runs
# `just generate` (every writer the gate checks the output of) through the
# locked SDK and, when anything changed, pushes the result as one commit and
# dispatches the gate and the page for it. Nobody has to remember a writer:
# a push that forgot one is followed by the commit that runs it. Each hour it
# also re-pins the brand to uor.foundation's newest main (brand/foundation.lock),
# so the brand, design and context-of-use facets regenerate from it; a site
# change that breaks a WCAG contrast fails the writer and is not pinned. Every
# run re-decides the MIR path's translations (`uorust prove`) and publishes the
# lift's honesty report: how many functions lifted, and the residue by the MIR
# kind or obligation that stopped it.
name: generate

on:
  push:
    branches: [main]
  # Hourly, so the brand follows uor.foundation without a push here.
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, never cancelled: a run in progress finishes and pushes,
# and only the newest of the pushes that land meanwhile runs next (GitHub
# keeps one pending run per group). Cancelling in progress meant a steady
# stream of pushes starved every run and nothing was ever regenerated.
concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    name: run every writer and push what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The brand authority, every writer through the locked SDK, and the
      # push: when main moved meanwhile, the writers run again on the new
      # main in this job (decided verdicts carry over), so what lands is
      # always the output of the tree it lands on and no push is lost.
      - name: Run every writer on main as it is, and push what changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATE_BUDGET: '4200'
        run: |
          scripts/ci/generate-loop.sh "Regenerate the generated files" \
            "CONFORMANCE.md README.md app model brand crates xtask frontier.toml lift-verdicts.toml" \
            bootstrap.yml pages.yml certified.yml
      - name: Publish the lift's honesty report
        if: always()
        shell: bash
        run: |
          {
            echo '## Lift honesty report'
            echo
            echo '```'
            sed -n '/^# Honesty report/,/^$/p' frontier.toml | sed 's/^# \{0,1\}//'
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

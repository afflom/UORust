# The certified translator (loop steps 3 and 4). On every push to main that
# changes the translator, its register or the toolchain, the first job rebuilds
# the certified translator from the generated self register (`just certified`:
# the lifted translator functions exported through `lexlean production`,
# kernel-checked, replayed with verify-artifact, taken into crates/certified)
# and pushes it when it changed. The gate then runs on amd64 and on arm64, each
# twice: the ratchet against the parent commit on registers generated from both
# commits (`just ratchet`), and the differential and fixpoint (`just
# certified-gate`), whose outputs are compared by their κ, never by an exit
# code. The last job requires both architectures' κ to be equal.
name: certified

on:
  push:
    branches: [main]
    paths:
      - 'crates/uorust/**'
      - 'crates/certified/**'
      - 'frontier.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'prismpm.lock'
      - 'Justfile'
      - '.github/workflows/certified.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# One run at a time, never cancelled: an export takes longer than main stays
# still, so cancelling in progress meant no export ever finished. GitHub keeps
# the newest waiting run; it runs next, on the newest main (as generate.yml).
concurrency:
  group: certified
  cancel-in-progress: false

jobs:
  export:
    name: export the lifted translator through lexlean production
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write
    env:
      # The minutes `certify production` may build for: the job's 120 less
      # the SDK pull, the self MIR and projection before it and the sync,
      # adapter tests and push after it. The roots unbuilt by then are refused
      # for this export, so it always ends with a manifest inside the timeout.
      EXPORT_MINUTES: 90
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The manifest of the last export, kept as an artifact: its push to main
      # is dropped whenever main moved during the export, so the refusals it
      # learnt reach the next export this way (`--prior`), and that one
      # builds no root the compiler already refused at the same κ.
      - name: Fetch the last export's manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/certified-prior
          id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=certified-manifest&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty' || true)
          if [[ -n $id ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" >target/certified-prior.zip
            unzip -q -o target/certified-prior.zip -d target/certified-prior
          fi
          ls target/certified-prior
      - name: Build the certified translator through the locked SDK
        shell: bash
        run: scripts/ci/sdk.sh "just certified $((EXPORT_MINUTES * 60))"
      - name: Keep the manifest for the next export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: certified-manifest
          path: crates/certified/manifest.toml
          retention-days: 30
      - name: Publish the bootstrap's share
        if: always()
        shell: bash
        run: |
          {
            echo '## Certified translator'
            echo
            echo '```'
            sed -n '/^\[share\]/,/^$/p' crates/certified/manifest.toml
            grep -c '^\[\[root\]\]' crates/certified/manifest.toml | sed 's/^/certified roots: /'
            grep -c '^\[\[refused\]\]' crates/certified/manifest.toml | sed 's/^/refused roots: /' || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Push the certified translator and dispatch the gate and the model
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/push.sh "Rebuild the certified translator" "crates/certified crates/uorust/src/certified.rs" certified.yml generate.yml

  gate:
    name: ratchet, differential and fixpoint / ${{ matrix.runner }} / run ${{ matrix.run }}
    needs: export
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        run: [1, 2]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The ratchet against the parent commit
        shell: bash
        run: scripts/ci/sdk.sh 'just ratchet HEAD~1'
      - name: Fetch the core MIR core.yml dumped, by its key
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          scripts/mir/fetch-mir.sh core target/core-mir
      - name: The differential and the fixpoint
        shell: bash
        run: scripts/ci/sdk.sh 'just certified-gate target/certified-gate'
      - name: Keep the outputs' κ
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: certified-kappa-${{ matrix.runner }}-${{ matrix.run }}
          path: target/certified-gate/kappa.txt
          retention-days: 7

  agree:
    name: every run on every architecture states the same κ
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: certified-kappa-*
          path: kappa
      - name: Compare the κ of the four runs
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(kappa/*/kappa.txt)
          if [[ ${#files[@]} -ne 4 ]]; then
            printf 'expected four runs, found %d\n' "${#files[@]}" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            if ! cmp -s "$f" "${files[0]}"; then
              printf '%s differs from %s\n' "$f" "${files[0]}" >&2
              diff "${files[0]}" "$f" >&2 || true
              exit 1
            fi
          done
          {
            echo '## Certified translator κ'
            echo
            echo '```'
            cat "${files[0]}"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

# The brand, design-system and context-of-use facets (scripts/experience):
# what product they describe. Everything else they read from the brand
# authority (brand/foundation.lock) and from this model's own facet modules.
spec = "prism/experience/1"
product = "UORust"
repository = "https://github.com/afflom/uorust"
# The product's own command line: a feature call whose text starts with it is
# a command the product home lists.
command = "uorust"

[links]
foundation = "https://uor.foundation/"
prismDocs = "https://uor.foundation/docs/"
source = "https://github.com/afflom/uorust"
releases = "https://github.com/afflom/uorust/releases"
learn = "https://afflom.github.io/prism-devrel/docs/"
# The uor.foundation docs look every Prism model's docs share (Prism-DevRel's devrel/docs.css).
stylesheet = "https://afflom.github.io/prism-devrel/docs/docs.css"

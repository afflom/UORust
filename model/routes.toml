# model/routes.toml --- UORust's route table, the single source both sides read.
#
# A route maps one kind of Rust fact, which the ingest stage reads from a Cargo
# workspace (`cargo metadata`, `Cargo.lock`, `syn`), to the one kind of Prism
# record the emitter writes for it, and the facet that record belongs to.
#
# Two implementations of this table must agree byte for byte:
#
# * the LexLean model `app/src/Routes.lex.tex`, UORust's own Prism application,
#   whose acceptance vectors (below, `[[vector]]`) are replayed in the compiled
#   guest by `prismpm verify` and whose theorems prove the table total and
#   ambiguity refused;
# * the Rust router in `crates/uorust*`, whose conformance test replays the same
#   vectors.
#
# `crates/conformance/tests/routes.rs` holds the model to this file: every
# route here is a row of the model's table, in this order, and every vector
# here is an acceptance vector of the application, in this order.
#
# Request: one fact's classification tags, one per line, UTF-8, at most 512
# bytes. Response: lines joined with a line feed, no trailing line feed.
#
#   every tag known, all naming one route -> route <id> / fact <tag> /
#                                            record <prism_record> / facet <facet>
#   empty request                         -> error empty
#   more than 512 bytes                   -> error too-large
#   not UTF-8                             -> error invalid-utf8
#   a blank line                          -> error blank-fact
#   a tag no route names                  -> refused unknown-fact / fact <tag>
#   two known tags naming different routes-> refused ambiguous / fact <a> / fact <b>
#
# The first offending line decides a refusal or error. A refusal is never a default:
# the engine records it as an open claim against the fact's source span.
#
# `facet` is one of: arch, features, behavior, design, sec, qual, release.

spec = "uorust/routes/1"

[[route]]
id = "UR-R01"
rust_fact = "crate-bin-target"
prism_record = "Foundation.Arch::Component"
facet = "arch"
note = "A [[bin]] target is a component of kind releaseBinary."

[[route]]
id = "UR-R02"
rust_fact = "crate-lib-target"
prism_record = "Foundation.Arch::Component"
facet = "arch"
note = "A [lib] target is a component of kind service."

[[route]]
id = "UR-R03"
rust_fact = "crate-doc"
prism_record = "Foundation.Arch::Concern"
facet = "arch"
note = "A crate-level doc comment states the concern the crate answers."

[[route]]
id = "UR-R04"
rust_fact = "package-author"
prism_record = "Foundation.Arch::Stakeholder"
facet = "arch"
note = "An authors entry or CODEOWNERS owner is a stakeholder."

[[route]]
id = "UR-R05"
rust_fact = "dependency-edge"
prism_record = "Foundation.Arch::Edge"
facet = "arch"
note = "A workspace-internal dependency is a control-flow edge between components."

[[route]]
id = "UR-R06"
rust_fact = "clap-subcommand"
prism_record = "Foundation.Arch::Feature"
facet = "features"
note = "A clap subcommand is a feature realized by the call it dispatches to."

[[route]]
id = "UR-R07"
rust_fact = "pub-fn"
prism_record = "Feature.calls"
facet = "features"
note = "A public function is an interface call a feature names."

[[route]]
id = "UR-R08"
rust_fact = "pub-trait"
prism_record = "Feature.calls"
facet = "features"
note = "A public trait method is an interface call a feature names."

[[route]]
id = "UR-R09"
rust_fact = "example-target"
prism_record = "Foundation.Arch::Journey"
facet = "features"
note = "An [[example]] target is a journey through the features it calls."

[[route]]
id = "UR-R10"
rust_fact = "test-fn"
prism_record = "Feature.acceptance"
facet = "features"
note = "A #[test] function is an acceptance row of the feature it exercises."

[[route]]
id = "UR-R11"
rust_fact = "doctest"
prism_record = "Feature.acceptance"
facet = "features"
note = "A doc test is an acceptance row of the item it documents."

[[route]]
id = "UR-R12"
rust_fact = "error-enum"
prism_record = "LexLean.inductive"
facet = "behavior"
note = "An enum that implements Error is a typed failure, an inductive with one constructor per variant."

[[route]]
id = "UR-R13"
rust_fact = "fn-body"
prism_record = "LexLean.definition"
facet = "behavior"
note = "A function body is lifted to a LexLean definition; what does not lift is residue in frontier.toml."

[[route]]
id = "UR-R14"
rust_fact = "unsafe-block"
prism_record = "Foundation.Sec::Threat"
facet = "sec"
note = "An unsafe block is a memory-safety threat (elevation of privilege)."

[[route]]
id = "UR-R15"
rust_fact = "ffi-extern"
prism_record = "Foundation.Sec::Threat"
facet = "sec"
note = "An extern block crosses the language boundary: a threat (elevation of privilege)."

[[route]]
id = "UR-R16"
rust_fact = "fs-use"
prism_record = "Foundation.Sec::Asset"
facet = "sec"
note = "A std::fs use is a file-system capability: an asset."

[[route]]
id = "UR-R17"
rust_fact = "net-use"
prism_record = "Foundation.Sec::Asset"
facet = "sec"
note = "A std::net use is a network capability: an asset."

[[route]]
id = "UR-R18"
rust_fact = "process-use"
prism_record = "Foundation.Sec::Asset"
facet = "sec"
note = "A std::process use is a process capability: an asset."

[[route]]
id = "UR-R19"
rust_fact = "env-use"
prism_record = "Foundation.Sec::Asset"
facet = "sec"
note = "A std::env use reads the environment: an asset."

[[route]]
id = "UR-R20"
rust_fact = "forbid-unsafe"
prism_record = "Foundation.Sec::ApplicationSecurityControl"
facet = "sec"
note = "#![forbid(unsafe_code)] is a control whose evidence is the compiler gate."

[[route]]
id = "UR-R21"
rust_fact = "advisory"
prism_record = "Foundation.Sec::Risk"
facet = "sec"
note = "A RustSec advisory against a locked package is a risk on the supply chain."

[[route]]
id = "UR-R22"
rust_fact = "lock-package"
prism_record = "System.SpdxPackage"
facet = "release"
note = "A Cargo.lock package is an SPDX package of the release's bill of materials."

[[route]]
id = "UR-R23"
rust_fact = "lint-config"
prism_record = "Foundation.Qual::QualityRequirement"
facet = "qual"
note = "A [lints] table entry is a maintainability requirement."

[[route]]
id = "UR-R24"
rust_fact = "rust-version"
prism_record = "Foundation.Qual::QualityRequirement"
facet = "qual"
note = "The rust-version (MSRV) field is a portability requirement."

[[route]]
id = "UR-R25"
rust_fact = "bench-target"
prism_record = "Foundation.Qual::QualityMeasure"
facet = "qual"
note = "A [[bench]] target is a performance-efficiency measure."

[[route]]
id = "UR-R26"
rust_fact = "state-enum"
prism_record = "Foundation.Arch::UmlState"
facet = "design"
note = "A fieldless enum matched in transitions is a UML state machine; each variant a state."

[[route]]
id = "UR-R27"
rust_fact = "call-edge"
prism_record = "Foundation.Arch::UmlMessage"
facet = "design"
note = "A call across crates is a synchronous message of the UML sequence view."

[[route]]
id = "UR-R28"
rust_fact = "module"
prism_record = "Foundation.Arch::OpmThing"
facet = "design"
note = "A module is an OPM object; its public functions are the processes that zoom into it."


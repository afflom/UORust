# model/ids.toml --- the conformance ID register.
#
# Every ID this repository claims, in one place, so that nothing is referenced
# without being defined. `CONFORMANCE.md` is generated from this file. A test
# whose name ends in an ID not listed here fails `check-model`, and an ID listed
# here with no scenario and no test fails it too (CM-02).
#
# `level` is the honesty level (R2):
#   some-true  a fact reproduced from an authority; not established here
#   build      constructed here and validated against its oracle
#   open       measured and reported, never asserted
#
# Every row here has a scenario in `features/suites/` and a test whose name ends
# in the ID, lowercased with underscores (R3, CM-02). There is no "pending"
# state: a capability that is not built does not get a row, and every row in this
# file is built.
#
# The SM rows are UORust's own Prism model in `app/`: the route table it
# applies and every facet of UORust itself.
# A capability starts with a row here; `just new-capability` writes the row,
# its scenario and its failing test in the order `AGENTS.md` sets out.

spec = "template/1"

[[id]]
id = "SM-01"
level = "build"
suite = "self-model"
statement = "UORust's application answers the route table of model/routes.toml route for route, and replays every router and workbench vector of that file in order"

[[id]]
id = "SM-02"
level = "build"
suite = "self-model"
statement = "The route table's theorems state, over the whole table and by decide, that every fact kind routes to its own row, that facts are distinct, and that any two kinds naming different routes are refused as ambiguous"

[[id]]
id = "SM-03"
level = "build"
suite = "self-model"
statement = "UORust is modeled in every facet: architecture, design views, features and journeys, security with its threat model, quality, the browser system release and compliance, each with records, and every module title has a project-local glossary entry"

[[id]]
id = "SM-04"
level = "build"
suite = "self-model"
statement = "The threat model maps every threat to a control with evidence or accepts it with a rationale, and every control's evidence names a gate, proof or review"

[[id]]
id = "UE-01"
level = "build"
suite = "engine"
statement = "uorust projects the fixture workspace into exactly the committed Prism project, which lexlean fmt, lexlean lock and prismpm check accept"

[[id]]
id = "UE-02"
level = "build"
suite = "engine"
statement = "Two projections of the same workspace are byte-identical, for the fixture and for this workspace"

[[id]]
id = "UE-03"
level = "build"
suite = "engine"
statement = "Admission refuses an ambiguous call, a feature without acceptance and a missing MSRV with typed refusals recorded as open claims, and emits no record for them"

[[id]]
id = "UE-04"
level = "build"
suite = "engine"
statement = "Total functions over bool, unsigned comparisons and unit enums lift to LexLean definitions, closed assertions over them become decide theorems, and every other function is residue with a typed reason"

[[id]]
id = "UE-05"
level = "build"
suite = "engine"
statement = "The engine's router equals model/routes.toml route for route and answers every router vector of that table exactly"

[[id]]
id = "UE-06"
level = "build"
suite = "engine"
statement = "Every way a run can end without a projection is a typed UorustError variant with a negative test"

[[id]]
id = "UE-07"
level = "build"
suite = "engine"
statement = "just vv checks the committed fixture projection and a fresh projection of this workspace with lexlean fmt --check, lexlean lock --check and prismpm check"

[[id]]
id = "UE-08"
level = "build"
suite = "engine"
statement = "A public trait's methods are interface calls its module's feature names, and a method call through the trait resolves to the trait's declaration"

[[id]]
id = "UE-09"
level = "build"
suite = "engine"
statement = "Each module with processes is its own OPM view beside its component's: the component is the object, the module's functions are its processes, and each process zooms into the processes it calls in the module"

[[id]]
id = "UE-10"
level = "build"
suite = "engine"
statement = "The Behavior and SupplyChain modules take their titles from uorust.titles, a glossary package the projection carries and locks"

[[id]]
id = "UE-11"
level = "build"
suite = "engine"
statement = "Unsigned arithmetic whose overflow the code names, signed integers, strings, structs, tuples, Option, Result with ?, slices with structural recursion, integer matches and string format! lift to LexLean definitions that lexlean verify accepts, with the Lean axioms they need declared"

[[id]]
id = "UE-12"
level = "build"
suite = "engine"
statement = "A RustSec advisory that affects a locked package's version is a Risk on the supply chain, answered by the advisory gate or accepted where deny.toml ignores it with its reason; one nothing answers is refused, and a run without a database records that none was consulted"

[[id]]
id = "UE-13"
level = "build"
suite = "engine"
statement = "Every feature of this workspace's own projection is admitted: each library module and binary entry point is exercised by a test, doctest or example, directly or through a helper of the test's file"

[[id]]
id = "UE-14"
level = "build"
suite = "engine"
statement = "uorust run on its own source reproduces its hand model: every hand component, call, threat, control and quality measure in app/src is paired with the derived record that states the same fact or listed as outside the code with a reason, the hand route table equals uorust::ROUTES, and the drift is 0"

[[id]]
id = "UE-15"
level = "build"
suite = "engine"
statement = "Iterator chains over slices and vectors (iter, map, filter, any, all, find, fold, count, contains, collect, join) lift to structurally recursive helpers, inherent methods of a lifted type lift with self as their first parameter, ordered maps and sets lift read-only as lists of entries with hash collections confined to lookups, early returns, let else and tuple lets at a function's own statements lift, and for loops over a list lift to walks whose accumulator is the locals the body updates (x = e, string +=, push, push_str), with if statements continuing into the rest of the block, all verified in Lean"

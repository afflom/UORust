# fmt: a `&mut dyn fmt::Write` is reached through a vtable, so the trait
# object is the text its writes build (a `Formatter`'s `buf`), and each
# write through it appends to that text and succeeds, as `String`'s impl
# does (alloc/src/string.rs). Core's own Display and Debug bodies then lift
# as functions of the value, the options and the buffer.
[[type]]
path = "dyn core::fmt::Write"
model = "str"
floor = "a trait object: a data pointer and a vtable of the implementor's methods"

[[model]]
path = "<dyn core::fmt::Write as core::fmt::Write>::write_str"
args = ["str", "str"]
result = "result<unit, $e>"
term = "(ctor Result.ok [Unit, {ty $e}] ())"
update = { 0 = '(prim join (cons {0} (cons {1} (nil String))) "" : String)' }
floor = "the call goes through the trait object's vtable"
rust = "{{ let mut s = String::from({0}); let r = core::fmt::Write::write_str(&mut s as &mut dyn core::fmt::Write, {1}); (r, s) }}"
vectors = [['"ab"', '"cd"', '(Ok(()), String::from("abcd"))'], ['""', '""', '(Ok(()), String::new())']]

[[model]]
path = "<dyn core::fmt::Write as core::fmt::Write>::write_char"
args = ["str", "char"]
result = "result<unit, $e>"
term = "(ctor Result.ok [Unit, {ty $e}] ())"
update = { 0 = '(prim join (cons {0} (cons {1} (nil String))) "" : String)' }
floor = "the call goes through the trait object's vtable"
rust = "{{ let mut s = String::from({0}); let r = core::fmt::Write::write_char(&mut s as &mut dyn core::fmt::Write, {1}); (r, s) }}"
vectors = [['"ab"', "'é'", '(Ok(()), String::from("abé"))']]

# fmt::Arguments and fmt::rt::Argument, the lang items format_args!
# lowers to: core holds them as raw pointers (a template pointer, and an
# argument array pointer or a tagged length) and erases each argument's
# type behind a function pointer (core/src/fmt/mod.rs, core/src/fmt/rt.rs).
# The lift holds Arguments as core's two representations: the literal
# `from_str` stores, or the template's pieces and the argument list `new`
# stores. The translator reads the template `format_args!` writes, a
# constant, in core's own encoding into pieces: each its literal text and,
# for a placeholder, its options and the index of its argument. An Argument
# is its value applied to its formatter: a function of the options a
# placeholder gives and the text written so far, to the result and the
# text after, as each Display or Debug body lifts.
# A formatting trait's object (`&dyn fmt::Debug`), as an Argument is: its
# value's method applied to it, a function of the options and the text
# written so far, to the method's result and the text after.
[[type]]
path = "dyn core::fmt::Debug"
model = "fn<named<fmt::FormattingOptions>,str,tuple<result<unit,named<fmt::Error>>,str>>"
floor = "a trait object: a data pointer and a vtable of the implementor's methods"

[[type]]
path = "dyn core::fmt::Display"
model = "fn<named<fmt::FormattingOptions>,str,tuple<result<unit,named<fmt::Error>>,str>>"
floor = "a trait object: a data pointer and a vtable of the implementor's methods"

[[type]]
path = "core::fmt::rt::Argument"
model = "fn<named<fmt::FormattingOptions>,str,tuple<result<unit,named<fmt::Error>>,str>>"
floor = "a value pointer and a formatter function pointer whose types are erased (rt::ArgumentType)"

[[type]]
path = "core::fmt::Arguments"
model = "tuple<option<str>,list<tuple<str,option<tuple<named<fmt::FormattingOptions>,usize>>>>,list<fn<named<fmt::FormattingOptions>,str,tuple<result<unit,named<fmt::Error>>,str>>>>"
floor = "a template pointer and an argument array pointer or a tagged length (NonNull<u8>, NonNull<rt::Argument>)"

[[model]]
path = "core::fmt::Arguments::from_str"
args = ["str"]
result = "tuple<option<str>,list<$p>,list<$f>>"
term = "{make tuple<option<str>,list<$p>,list<$f>> (ctor Option.some [String] {0}) (nil {ty $p}) (nil {ty $f})}"
floor = "the str's pointer transmuted to NonNull<u8>, its length tagged into the args pointer"
rust = "format_args!({0}).as_str()"
vectors = [['"ab"', 'Some("ab")']]

[[model]]
path = "core::fmt::Arguments::from_str_nonconst"
args = ["str"]
result = "tuple<option<str>,list<$p>,list<$f>>"
term = "{make tuple<option<str>,list<$p>,list<$f>> (ctor Option.some [String] {0}) (nil {ty $p}) (nil {ty $f})}"
floor = "Arguments::from_str"
rust = "format_args!({0}).as_str()"
vectors = [['""', 'Some("")']]

[[model]]
path = "core::fmt::Arguments::as_str"
args = ["tuple<option<str>,list<$p>,list<$f>>"]
result = "option<str>"
term = "{item 0 {0}}"
floor = "the args pointer's tag bit read with a pointer-to-integer transmute"
rust = "format_args!({0}).as_str()"
vectors = [['"lit"', 'Some("lit")']]

# fmt::write runs the template on the output: a literal from_str stored is
# written whole; otherwise each piece's text is written, and each
# placeholder's argument applied to its options and the text so far, until
# one fails. (An index past the arguments, which format_args! never
# writes, writes nothing.)
[[model]]
path = "core::fmt::write"
args = ["str", "tuple<option<str>,list<$p>,list<fn<$o,str,$r>>>"]
result = "result<unit,$e>"
term = "(match {item 0 {1}} | Option.some literal => (ctor Result.ok [Unit, {ty $e}] ()) | Option.none => {item 0 ({aux fmt_write} {item 1 {1}} {item 2 {1}} {0})})"
update = { 0 = '(match {item 0 {1}} | Option.some literal => (prim join (cons {0} (cons literal (nil String))) "" : String) | Option.none => {item 1 ({aux fmt_write} {item 1 {1}} {item 2 {1}} {0})})' }
floor = "the template is read through NonNull<u8> and each argument called through its erased function pointer"
rust = "{{ let mut s = String::from({0}); let r = core::fmt::write(&mut s, {1}); (r, s) }}"
vectors = [
  ['"<"', 'format_args!("{}-{:>3}|{:#x}", 7u8, "ab", 255u32)', '(Ok(()), String::from("<7- ab|0xff"))'],
  ['""', 'format_args!("lit")', '(Ok(()), String::from("lit"))'],
]


# The standard library as the MIR path sees it, keyed by std path.
#
# A call into std resolves, in this order, to:
# 1. a model below (`[[model]]`), for an operation whose std body bottoms out
#    in intrinsics or unsafe raw-pointer code (each says where, in `floor`),
#    so its MIR cannot lift to values; the model is the operation on the
#    lift's types, written once here for every call site;
# 2. std's own MIR (`lift`), vendored in std.mir at the pinned toolchain by
#    scripts/mir/fetch-std.sh, translated by the same lowering as the
#    workspace's own bodies and instantiated at the call's types; each
#    instance is one definition named by its path and types, so it is
#    translated, and decided by the verifier, once for all its callers;
# 3. residue naming the callee.
#
# A model's `args` and `result` are type patterns over the lift's types:
# bool, str, char, usize, nat (any unsigned width), text (str or char),
# unit, list<P>, option<P>, set<P>, map<P, P>, and $name, which binds any
# type and must bind the same type at each use. `term` is the value, `update`
# the new value of a `&mut` argument (by position) as a backward function
# returns it. Placeholders: {0}.. the arguments, {ty $t} a bound type,
# {prelude f} the prelude's f, {aux n} the instance of an auxiliary
# definition below at the bound types, {eq $t a b} and {lt $t a b} the
# equality and order of a bound type (strings by their bytes, which is std's
# order for them; naturals as numbers), {key x} and {value x} an entry of
# the bound map, {self} an auxiliary definition's own name.
#
# Every model carries `vectors`: arguments and the result std gives, as Rust
# literals; the generated test std_vectors.rs runs std itself on them, so a
# model that disagrees with std on one of them fails the suite. (The Lean
# kernel does not reduce the prelude's UTF-8 decoding, so `decide` cannot
# prove the same vectors of the text models in the projection.)

toolchain = "1.97.1"
# rust-src of that toolchain, as its channel manifest pins it, and the
# vendored std.mir that fetch-std.sh dumped from it.
rust_src_xz_sha256 = "e9a1e616d04c6845895c827a178b9227f7c7199f3f4a80af81ab3aff7b80156b"
std_mir_sha256 = "8b1292a5735f3d4e3fd33af218aea54e3ab8256181ef515efdd8565ad9994730"

# The std items whose own MIR the path lifts (step 2), by the path rustc
# prints for their definition.
lift = [
  "core::option::Option::unwrap_or",
  "core::option::Option::is_some",
  "core::option::Option::is_none",
  "core::result::Result::is_ok",
  "core::result::Result::is_err",
  "core::result::Result::ok",
  "core::cmp::PartialEq::ne",
  # slice::Iter's own short-circuiting searches (core/src/slice/iter/macros.rs):
  # each loops on `next`, which the cursor model guards.
  "core::slice::iter::<impl Iter>::any",
  "core::slice::iter::<impl Iter>::all",
  "core::slice::iter::<impl Iter>::find",
]

# Core's own types the models below build values of, as core's MIR prints
# them: core's scope instantiates each from its declaration in every module.
instantiate = ["fmt::Formatter<'_>", "fmt::FormattingOptions", "fmt::Error"]

# Types whose representation bottoms out in raw pointers, as the lift's
# value types.
[[type]]
path = "std::collections::BTreeMap"
model = "map<$k, $v>"
floor = "B-tree nodes behind NonNull raw pointers (alloc::collections::btree::node)"

[[type]]
path = "std::collections::BTreeSet"
model = "set<$t>"
floor = "a BTreeMap<T, SetValZST>, whose nodes are behind NonNull raw pointers"

# An iterator over a sequence is a cursor: the items and the two positions
# it has reached from the front and from the back (slice::Iter's `ptr` and
# `end` as indices into its slice). `next` is `Some` exactly while the front
# is below the back, so a `for` loop over it exits on an order of naturals.
[[type]]
path = "std::slice::Iter"
model = "cursor<$t>"
floor = "the pointers ptr and end_or_len into the slice (NonNull<T>, *const T)"

[[type]]
path = "std::vec::IntoIter"
model = "cursor<$t>"
floor = "the buffer and the pointers ptr and end into it (NonNull<T>, *const T)"

[[type]]
path = "std::collections::btree_set::Iter"
model = "cursor<$t>"
floor = "a range of leaf edges, handles behind NonNull node pointers"

[[type]]
path = "std::collections::btree_set::IntoIter"
model = "cursor<$t>"
floor = "a dying B-tree's leaf edges, handles behind NonNull node pointers"


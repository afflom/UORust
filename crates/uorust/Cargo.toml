[package]
name = "uorust"
description = "Reads a Cargo workspace and writes a complete, checked Prism project: router proposals, admission with typed refusals, byte-deterministic projection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["prism", "lexlean", "cargo", "workspace", "model"]
categories = ["development-tools", "command-line-utilities"]
# The packaged crate is the source and the project assets it embeds
# (`include_str!` of assets/project/...), with the manifest and the README
# cargo adds: the test fixtures stay in the repository.
include = ["/src/**/*.rs", "/assets/**"]

# cargo-binstall installs the archive release.yml attaches to the release:
# uorust-<target>.tar.gz (a .zip on Windows) holding uorust-<target>/uorust.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[[bin]]
name = "uorust"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
semver = "1.0.28"
serde_json = "1.0.151"
sha2 = "0.10.9"
syn = { version = "3", features = ["full", "visit", "visit-mut", "extra-traits"] }
toml = "0.8"

[lints]
workspace = true

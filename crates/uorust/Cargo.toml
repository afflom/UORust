[package]
name = "uorust"
description = "Reads a Cargo workspace and writes a complete, checked Prism project: router proposals, admission with typed refusals, byte-deterministic projection."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "uorust"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
semver = "1.0.28"
serde_json = "1.0.151"
sha2 = "0.10.9"
syn = { version = "3", features = ["full", "visit", "extra-traits"] }
toml = "0.8"

[lints]
workspace = true

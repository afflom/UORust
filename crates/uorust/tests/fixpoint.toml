fact = "threshold := 89"

[[pair]]
hand = "measureUnsafeBlocks"
derived = "measureUnsafeAndForeignSites"
fact = "threshold := 0"

# An outside row is typed by `kind`, and the test checks what the kind claims:
#   external-system     the hand component's kind is externalSystem
#   private-stage       `module` is a private module of the uorust library,
#                       which the engine projects inside its crate's component
#   outside-rust        `path` exists and holds no Rust source
#   run-time            `gate` is the register ID or Justfile recipe that
#                       measures it on every run of the gate
#   reviewer-judgement  a modeled threat or control the reviewer argues; no
#                       fact kind of the route table states one
#   this-gate           the drift measure this file is the gate for

[[outside]]
hand = "componentIngest"
kind = "private-stage"
module = "ingest"
reason = "a stage inside the uorust library; the engine projects at crate and public-module granularity"

[[outside]]
hand = "componentAdmission"
kind = "private-stage"
module = "admit"
reason = "a stage inside the uorust library; the engine projects at crate and public-module granularity"


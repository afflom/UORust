# The fixpoint between the hand model in app/src and uorust's projection of
# this workspace (UE-14). Every hand record of a checked kind is either paired
# with the record the engine derives for the same fact, or listed as outside
# what the code states, with the reason. A pair holds when both records exist
# and both bodies state the fact; each pair that does not hold is one unit of
# drift, and the hand model's measureSelfModelDrift sets the threshold at 0.

checked = ["component", "call", "modeledThreat", "modeledControl", "measure"]

[[pair]]
hand = "callProject"
derived = "callCliUorustProject"
fact = "uorust project"


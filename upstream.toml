# Every upstream fix this repository carries as a local patch, and how to tell
# that a release ships it. Policy: patch the upstream, open its PR, pin to the
# patch, and re-pin to the release once it ships. upstream.yml reads this file
# on a schedule (scripts/ci/upstream.py): when a release carries a fix it opens
# an issue naming the release and, where the re-pin is mechanical, dispatches
# it. Add a row the moment a patch lands; delete it when the re-pin does.
#
#   fix       the upstream commit that carries the fix, once merged; until then
#             `pull` is followed to its merge commit.
#   release   how a release is found:
#               ghcr  an image repository tagged sha-<commit> per build
#               npm   a package whose versions record gitHead
#               branch  the upstream default branch, once it contains the fix
#   repin     what re-pins: "template-update" dispatches template-update.yml
#             with the release's SDK image and its PrismPM action commit at
#             the template revision template.lock pins; "frame" pins the frame
#             (bootstrap/frame-sync.mjs --pin) to the upstream commit, drops
#             this row and pushes; "issue" only reports.

[[patch]]
id = "prismpm-sdk-view-closure"
what = "The SDK is ghcr.io/afflom/prismpm-sdk-patched (sdk-patch.yml): the pinned candidate plus prismpm with the browser closure v2 fix."
pinned = "prismpm.lock, .devcontainer/devcontainer.json, template.lock"
repository = "UOR-Foundation/PrismPM"
pull = 615
fix = "359d7f5bfa8e01272ba6028c30c94459420ebb6a"
release = { kind = "ghcr", image = "ghcr.io/uor-foundation/prismpm-sdk-candidate" }
repin = "template-update"

[[patch]]
id = "prismpm-threat-model-appended-lists"
what = "The SDK is ghcr.io/afflom/prismpm-sdk-patched@sha256:21ac51c7c8027566e52566f3c6cd4c699a5468f422f01907cd2307f9c3e0b352 (sdk-patch.yml at PrismPM b9b7cdb, the pinned SDK commit plus the fix): prismpm check reads a threat-model list literal written as balanced appends. The self-projection writes each control's evidence list that way (crates/uorust/src/project.rs, embed::term_list), so the LexLean linker's JSON nesting limit does not bound how many sites a control lists."
pinned = "prismpm.lock, .devcontainer/devcontainer.json, template.lock"
repository = "UOR-Foundation/PrismPM"
pull = 673
release = { kind = "ghcr", image = "ghcr.io/uor-foundation/prismpm-sdk-candidate" }
repin = "template-update"

[[patch]]
id = "prism-code-target2-stack-globals"
what = "try/vendor/prism-code/src/core.mjs accepts a target/2 guest's __stack_low and __stack_high exports (VENDOR.md, Local patch)."
pinned = "try/vendor/prism-code"
repository = "UOR-Foundation/PrismPM"
pull = 640
release = { kind = "npm", package = "prism-code" }
repin = "issue"

[[patch]]
id = "template-frame-live-controls"
what = "frame.lock pins the frame to UOR-Foundation/template PR #62's branch: the page's input and example buttons work while the holo verifies (c7cb216), on top of the patched SDK pin."
pinned = "frame.lock, site/app.mjs and the other frame files"
repository = "UOR-Foundation/template"
pull = 62
release = { kind = "branch" }
repin = "frame"

# Gaps: an upstream limit that residue stops at and that no patch carries
# yet, with the plan for the patch. upstream.py counts, per gap, the rows of
# the MIR registers (crates/uorust/core, std, crates) whose cause starts with
# one of its `causes`, and with --act opens one issue per gap carrying its
# plan; once `pull` names the upstream PR it follows it, and the gap becomes
# a [[patch]] row when the PR merges.

[[gap]]
id = "lexlean-nat-to-signed"
repository = "UOR-Foundation/LexLean"
what = "LexLean 0.4.0 converts no Nat to another integer family: checked_convert takes Int and the fixed-width families but not Nat, to_int takes only the fixed widths, and Int64 has no arithmetic beyond the checked_* primitives (src/ir/semantic.rs, infer_primitive). So the MIR path holds every Rust integer as Nat, with signed ones as their two's-complement bit patterns (crates/uorust/src/mir/int.rs). An AST-lifted Int64 value can flow into Nat (to_int, then emod, then UInt64 limbs, then to_nat), but a Nat can never flow back: a MIR-path call to an AST-lifted function with an Int64 parameter, or a struct with an Int64 field, stays residue."
plan = "Admit Nat as checked_convert's input (Option of any fixed width, none outside its range) and as to_int's (exact), with both elaborating in linking as to_nat does. Then the AST path's Int64 and the MIR path's bit patterns meet in a cast, and the boundary residue closes."
residue = "mir::TerminatorKind::Call and mir::Rvalue::Aggregate rows that pass a signed value to an AST-lifted Int64 parameter or field: the workspace's own register, since core, std and crates have no AST-lifted callee"
causes = []

[[gap]]
id = "lexlean-nat-bitwise"
repository = "UOR-Foundation/LexLean"
what = "LexLean 0.4.0's bit_and, bit_or, bit_xor, bit_not, shift_left and shift_right take only the fixed-width families, and Nat has no power. The MIR path holds every integer as Nat (gap lexlean-nat-to-signed), so it writes its bit operations by recursion on the low bit: mirPowTwo, mirBitAnd, mirBitOr, mirBitXor, mirCountOnes, mirBitLength, mirTrailingZeros and mirReverseBits (crates/uorust/src/mir/int.rs), each well-founded by a linear_arithmetic measure. No body stops at the gap, but a theorem about one of those helpers needs induction where a primitive would decide."
plan = "Admit Nat in bit_and, bit_or and bit_xor (Lean's Nat.land, Nat.lor and Nat.xor), in shift_left and shift_right with a Nat amount and a Nat result (Nat.shiftLeft and Nat.shiftRight), and a Nat power. The MIR path then writes x & y as (prim bit_and x y : Nat) in place of mirBitAnd, and its obligations over bit operations decide."
residue = "none: the recursive helpers carry every bit operation"
causes = []

# The tool's factory graph: the one source of its obligations. Nothing else
# states an obligation's inputs, kind or needs. `prism-factory/graph.py write`
# writes the model text (model/src/Factory/UORust.lex.tex) and the README's
# table from this file and the Justfile; `graph.py check` refuses either when it
# differs, and refuses a graph that leaves a part of the gate or a writer
# without the obligation that establishes it.
#
# An obligation's run is the body of the Justfile recipe it names (`recipe`),
# so the Justfile stays the one statement of each command. A recipe run in the
# SDK (`sdk = true`) is run through prism-factory/sdk.sh, which reads the image
# from prismpm.lock; both are inputs of such an obligation (set `sdk`), so the
# image's digest is part of its identity. A writer's obligation (`writes`) runs
# the writer through prism-factory/written.sh and passes only when the writer
# changes none of the files it writes: the committed outputs are current.
#
# Inputs are prefixes of tracked paths, `!prefix` an exclusion, as the
# upstream README states. `sets` name the lists below, expanded in order before
# `inputs`. `untouched` says which changes leave the obligation's identity as
# it is; the README carries it.

[sets]
sdk = ["prismpm.lock", "prism-factory/sdk.sh"]
manifests = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", ".cargo/"]
# What the workspace compiles: every crate's sources and manifests, without
# the registers, ledgers and fixture workspaces the build never reads, plus
# the files outside crates/ that a crate embeds (include_str!/include_bytes!).
rust = [
  "crates/",
  "!crates/uorust/core/",
  "!crates/uorust/std/",
  "!crates/uorust/crates/",
  "!crates/uorust/ledger/",
  "!crates/uorust/tests/fixtures/",
  "crates/uorust/tests/fixtures/nist-sha256/",
  "xtask/",
  "app/lexlean.lock",
  ".github/dependabot.yml",
  ".github/workflows/bootstrap.yml",
  ".github/workflows/prismpm.yml",
  ".github/workflows/template-update.yml",
]
# The template contract's files: the policy files template.lock binds and the
# paths the contract requires.
template = [
  ".devcontainer/",
  ".github/",
  "AGENTS.md",
  "CONFORMANCE.md",
  "README.md",
  "VERIFICATION.md",
  "template.lock",
  "template-contract.json",
]
# The whole workspace as `uorust` projects it: every crate, the registers and
# fixtures included, the committed lift register and verdicts.
workspace = ["crates/", "xtask/", "frontier.toml", "lift-verdicts.toml", "app/lexlean.lock", ".github/"]

[[obligation]]
name = "factory-model"
kind = "hermetic"
recipe = "factory-model"
sdk = true
sets = ["sdk"]
inputs = ["prism-factory/", "Justfile", "rust-toolchain.toml"]
untouched = "anything outside prism-factory/, the Justfile, the toolchain file and the SDK lock"

[[obligation]]
name = "factory-upstream"
kind = "fetch"
recipe = "factory-upstream"
sdk = false
sets = []
inputs = ["prism-factory/"]
untouched = "anything outside prism-factory/"

[[obligation]]
name = "fmt-check"
kind = "hermetic"
recipe = "fmt-check"
sdk = true
sets = ["sdk", "manifests", "rust"]
inputs = ["rustfmt.toml"]
untouched = "the model, the app, the registers, the fixtures, scripts, the site, the documents"

[[obligation]]
name = "model"
kind = "fetch"
recipe = "model"
sdk = true
sets = ["sdk", "manifests", "template"]
inputs = ["crates/", "xtask/", "model/", "LANES.md", "TEMPLATE-CONTRACT.md", "TEMPLATE-VERIFICATION.md"]
untouched = "the app, scripts, the site, the brand, frontier.toml, lift-verdicts.toml"

[[obligation]]
name = "template-check"
kind = "fetch"
recipe = "template-check"
sdk = true
sets = ["sdk", "manifests", "template"]
inputs = ["crates/", "xtask/", "model/", "Justfile"]
untouched = "the app, scripts, the site, the brand, frontier.toml, lift-verdicts.toml"

[[obligation]]
name = "self-model-check"
kind = "hermetic"
recipe = "self-model-check"
sdk = true
sets = ["sdk"]
inputs = [
  "model/",
  "app/",
  "brand/",
  "scripts/self-model/",
  "scripts/experience/",
  "scripts/mir/ledger.py",
  "crates/uorust/src/",
  "crates/uorust/core/frontier.toml",
  "crates/uorust/std/frontier.toml",
  "crates/uorust/crates/",
  "crates/certified/manifest.toml",
  "frontier.toml",
  "site/app.json",
  ".github/workflows/",
  "Cargo.toml",
  "README.md",
]
untouched = "the other crates, the fixtures, xtask/, the lock files, lift-verdicts.toml"

[[obligation]]
name = "lint"
kind = "fetch"
recipe = "lint"
sdk = true
sets = ["sdk", "manifests", "rust"]
inputs = ["clippy.toml"]
untouched = "the model, the app, the registers, the fixtures, scripts, the site, the documents"

[[obligation]]
name = "test"
kind = "fetch"
recipe = "test"
sdk = true
sets = ["sdk", "manifests", "workspace"]
# UE-20 (crates/conformance/tests/factory.rs) checks this component, SM-05
# (self_model.rs) reads the brand's foundation stylesheet, a CLI test runs
# scripts/hooks/passes.py, the script suite runner (crates/conformance/tests/
# ci.rs) runs every suite under scripts/, SM-07 (browser_acceptance.rs) loads
# bootstrap/acceptance-result.test.mjs and the site modules it imports, the
# R2 meta-check (crates/conformance/src/meta.rs)
# reads VERIFICATION.md and ANALYSIS.md where they exist, and UE-18
# (ratchet.rs) compares the register and the manifest with the parent's: the
# `@base:` entries, so a test of one tree under two parents is two identities.
inputs = [
  "model/",
  "features/",
  "app/",
  "Justfile",
  "CONFORMANCE.md",
  "README.md",
  "VERIFICATION.md",
  "ANALYSIS.md",
  "scripts/ci/",
  "scripts/hooks/passes.py",
  "scripts/release/",
  "scripts/self-model/",
  "bootstrap/acceptance-result.test.mjs",
  "site/acceptance-result.mjs",
  "site/guest-worker.mjs",
  "site/spec.mjs",
  "prism-factory/",
  "brand/foundation/src/index.css",
  "@base:frontier.toml",
  "@base:crates/certified/manifest.toml",
]
untouched = "the site other than the three modules SM-07 loads, the brand other than its foundation stylesheet, scripts other than scripts/ci/, scripts/release/, scripts/self-model/ and scripts/hooks/passes.py, the documents other than CONFORMANCE.md, README.md, VERIFICATION.md and ANALYSIS.md, the parent's files other than its register and manifest"

[[obligation]]
name = "deny"
kind = "fetch"
recipe = "deny"
sdk = true
sets = ["sdk", "manifests", "rust"]
inputs = ["deny.toml"]
untouched = "the model, the app, the registers, the fixtures, scripts, the site, the documents"

[[obligation]]
name = "app"
kind = "fetch"
recipe = "app"
sdk = true
sets = ["sdk", "manifests", "rust"]
inputs = ["app/", "Justfile"]
untouched = "the site, registers, non-workspace scripts and documents; app, Rust and recipe inputs invalidate this proof"

[[obligation]]
name = "uorust"
kind = "fetch"
recipe = "uorust"
sdk = true
sets = ["sdk", "manifests", "workspace"]
inputs = []
untouched = "the model, the app, scripts, the site, the documents"

[[obligation]]
name = "vv"
kind = "hermetic"
recipe = "vv"
sdk = false
sets = []
inputs = ["Justfile"]
needs = ["fmt-check", "model", "template-check", "self-model-check", "lint", "test", "deny", "app", "uorust"]
untouched = "everything its parts leave untouched, and the Justfile's other recipes only through its own input"

[[obligation]]
name = "prove-fixture"
kind = "fetch"
recipe = "prove-fixture"
sdk = true
sets = ["sdk", "manifests", "rust"]
inputs = ["crates/uorust/tests/fixtures/mir-path/", "prism-factory/written.sh"]
writes = ["crates/uorust/tests/fixtures/mir-path/lift-verdicts.toml"]
untouched = "the model, the app, the other fixtures, the registers, scripts, the site, the documents"

[[obligation]]
name = "prove"
kind = "fetch"
recipe = "prove"
sdk = true
sets = ["sdk", "manifests", "workspace"]
inputs = ["prism-factory/written.sh"]
writes = ["lift-verdicts.toml"]
untouched = "the model, the app, scripts, the site, the documents"

[[obligation]]
name = "certified"
kind = "fetch"
recipe = "certified"
sdk = true
sets = ["sdk", "manifests", "workspace"]
inputs = ["Justfile", "prism-factory/written.sh"]
writes = ["crates/certified/", "crates/uorust/src/certified.rs"]
needs = ["prove"]
untouched = "the model, the app, scripts, the site, the documents"

# The writers of `just generate`, each with the obligation whose pass means the
# writer has nothing to write: its committed output is what it writes now.
[[writer]]
recipe = "fmt"
checked_by = "fmt-check"

[[writer]]
recipe = "self-model-write"
checked_by = "self-model-check"

[[writer]]
recipe = "fixtures"
checked_by = "uorust"

[[writer]]
recipe = "prove-fixture"
checked_by = "prove-fixture"

[[writer]]
recipe = "prove"
checked_by = "prove"

[[writer]]
recipe = "register"
checked_by = "uorust"

[[writer]]
recipe = "model-write"
checked_by = "model"
